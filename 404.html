<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — OpsToData</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0E1512;
    --ink: #E9E6DC;
    --ink-dim: #9DA69E;
    --amber: #E8A33D;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 28px;
  }
  .box{ max-width: 460px; text-align:left; }
  .code{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size: 3rem;
    color: var(--amber);
    margin: 0 0 12px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size: 1.5rem;
    margin: 0 0 16px;
  }
  p{ color: var(--ink-dim); margin: 0 0 24px; }
  a{ color: var(--amber); }
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>Esta página no existe.</h1>
    <p>Puede que el enlace esté mal escrito o que la página se haya movido.</p>
    <a href="/">Volver al inicio</a>
  </div>
</body>
</html>
